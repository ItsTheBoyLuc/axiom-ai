# Local full stack: `docker compose up -d --build`. Requires a .env (copy .env.example).
name: axiom-ai

# Web and worker run as the least-privilege role `axiom_app` (docker/initdb/01-app-role.sh).
x-app-env: &app-env
  NODE_ENV: production
  APP_URL: ${APP_URL:-http://localhost:3000}
  DATABASE_URL: postgresql://axiom_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-axiom}
  REDIS_URL: redis://redis:6379
  CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-3001}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}

# Runtime hardening shared by web and worker: no capabilities, no privilege escalation, read-only
# root filesystem (only /tmp and the Next.js cache are writable).
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  read_only: true
  tmpfs: ['/tmp', '/app/.next/cache']

services:
  # One-shot: applies pending Prisma migrations, then exits. web and worker wait for it. It is the
  # only service that connects as the database owner (DDL), and also runs seed and admin:create.
  migrate:
    build: { context: ., dockerfile: docker/Dockerfile, target: migrate }
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-axiom}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-axiom}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  web:
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    # Loopback by default: put a reverse proxy or the Cloudflare Tunnel in front (docs/DEPLOYMENT.md).
    # Never publish the app directly: per-address rate limits trust a header the proxy sets.
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000']
    environment: *app-env
    <<: *hardened
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    environment: *app-env
    <<: *hardened
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axiom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-axiom}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    ports: ['127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'] # loopback only
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redisdata:/data']
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'] # loopback only
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Optional: Cloudflare Tunnel (docs/DEPLOYMENT.md). `docker compose --profile tunnel up -d`.
  cloudflared:
    image: cloudflare/cloudflared:latest # pin a version tag in production
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-} # required when the profile is enabled
    depends_on:
      web: { condition: service_healthy }
    profiles: [tunnel]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
