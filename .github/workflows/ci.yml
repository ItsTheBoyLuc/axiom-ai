name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://axiom:ci@localhost:5432/axiom
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: axiom, POSTGRES_PASSWORD: ci, POSTGRES_DB: axiom }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U axiom" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Blocking gate: production dependencies only (see docs/DECISIONS.md, 2026-10-03).
      - run: npm audit --omit=dev --audit-level=high
      # Keeps dev-dependency advisories visible in the log without failing the build.
      - name: Full audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
      # A Docker image build job is added in the hardening phase.
