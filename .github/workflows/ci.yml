name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://axiom:ci@localhost:5432/axiom
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: axiom, POSTGRES_PASSWORD: ci, POSTGRES_DB: axiom }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U axiom" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      # Integration, Playwright and Docker build jobs are added in later phases.
