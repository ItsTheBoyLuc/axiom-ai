name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://axiom:ci@localhost:5432/axiom
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: axiom, POSTGRES_PASSWORD: ci, POSTGRES_DB: axiom }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U axiom" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Blocking gate: production dependencies only (see docs/DECISIONS.md, 2026-10-03).
      - run: npm audit --omit=dev --audit-level=high
      # Keeps dev-dependency advisories visible in the log without failing the build.
      - name: Full audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  # Builds the three images (web, worker, migrate) and boots the whole stack the way production
  # does: least-privilege database role, read-only containers, loopback-only port.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure a throw-away environment
        run: |
          cp .env.example .env
          sed -i 's/^WEB_PORT=.*/WEB_PORT=3000/' .env
      - name: Build images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health, seed and a real page
        run: |
          curl -fsS http://127.0.0.1:3000/api/v1/health
          docker compose run --rm migrate npm run db:seed
          curl -fsS -o /dev/null http://127.0.0.1:3000/models
          curl -fsS http://127.0.0.1:3000/api/v1/stats | grep -q '"totalModels"'
      - name: Containers run as non-root, read-only, as the app database role
        run: |
          test "$(docker compose exec -T web id -u)" != "0"
          test "$(docker compose exec -T worker id -u)" != "0"
          if docker compose exec -T web touch /app/probe 2>/dev/null; then echo "web filesystem is writable"; exit 1; fi
          if docker compose exec -T postgres psql -U axiom_app -d axiom -c 'create table probe(x int)' 2>/dev/null; then echo "app role can create tables"; exit 1; fi
          csp="$(curl -fsSI http://127.0.0.1:3000/ | tr -d '\r' | grep -i '^content-security-policy:')"
          echo "$csp" | grep -q "frame-ancestors 'none'"
      - name: Back up and prove the backup restores
        run: |
          scripts/ops/backup-postgres.sh
          scripts/ops/restore-test-postgres.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
